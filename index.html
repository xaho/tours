<head>
    <title>Travels</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.2/themes/base/jquery-ui.css" integrity="sha256-8I0prl0EXe7lj+6vlcqXn4mMvZdibijLQ4hi+7nvtyI=" crossorigin="anonymous">
    <script defer src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script defer src="https://code.jquery.com/ui/1.14.2/jquery-ui.js" integrity="sha256-zKbi8I2J5A9/AtXEXqfqZN23Mt1wpVcyEDYCF/PSYKw=" crossorigin="anonymous"></script>
    <script type="module" defer src="./dist/config.js"></script>
    <script type="importmap">
        { "imports": { "tours": "./node_modules/tours/dist/index.js" } }
    </script>
    <script type="module" defer src="./node_modules/tours/dist/index.js"></script>
    <style>
        #map {
            flex: 1;
        }

        body {
            display: flex;
            flex-direction: row;
            height: 100%;
            margin: 0;
        }

        .collapsible-map-control {
            background: #fff;
            border-radius: 3px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
            margin: 10px;
        }

        .collapsible-map-control__toggle {
            background: #fff;
            border: 0;
            color: rgb(25, 25, 25);
            cursor: pointer;
            font-family: Roboto, Arial, sans-serif;
            font-size: 18px;
            height: 40px;
            line-height: 36px;
            padding: 0 10px;
        }

        .collapsible-map-control__content {
            display: none;
        }

        .collapsible-map-control--expanded .collapsible-map-control__content {
            display: block;
        }

        .collapsible-map-control--expanded .collapsible-map-control__toggle {
            border-radius: 3px 0 0 3px;
            border-bottom: #E9E9E9 2px solid;
            width: 100%;
        }

        #legend {
            background: #fff;
            padding: 10px;
            margin: 10px;
            border-radius: 2px;
            box-shadow: rgba(0, 0, 0, 0.3) 0 1px 4px -1px;

            .GMAMP-maps-pin-view {
                vertical-align: middle;
            }

            > div > span {
                margin-left: 12px;
            }

            > .legend-subtext {
                margin-top: 10px;
            }

            > gmp-pin {
                display: inline-grid !important;
            }
        }

        body > #legend {
            display: none; /* Hide legend, until it is moved into the map */
        }

        #filters {
            background-color: #fff;
            border: 0;
            color: rgb(25, 25, 25);
            height: 400px;
            overflow-y: auto;
            padding: 12px;

            button {
                background-color: #fff;
                border: 2px solid #fff;
                border-radius: 3px;
                box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
                color: rgb(25, 25, 25);
                cursor: pointer;
                font-family: Roboto, Arial, sans-serif;
                line-height: 28px;
                padding: 0 5px;
                /*text-align: 'center';*/

                &:not(:first-child) {
                    margin-block-start: 1rem;
                }
            }

            .checkbox-row {
                display: flex;
                align-items: center;

                > label {
                    user-select: none;
                }
            }

            h1 {
                font-size: 14px;
            }

            #slider-range {
                margin: 12px 0;
            }
        }
    </style>
</head>

<body>
<div id="map"></div>
<div id="legend"></div>
</body>
